{% extends "base.html" %}
{% block title %}Lite Drive — Sign in{% endblock %}
{% block bodyclass %}login-page{% endblock %}
{% block body %}
<main class="login-card">
  <h1>Lite Drive</h1>
  <p class="muted">Sign in to your drive</p>
  <form id="login-form" autocomplete="on">
    <label>Email <input id="email" name="email" type="email" required autocomplete="username"></label>
    <label>Password <input id="password" name="password" type="password" required autocomplete="current-password"></label>
    <button id="login-btn" type="submit">Sign in</button>
    <p id="login-status" class="status" role="status"></p>
  </form>
</main>
{% endblock %}
{% block scripts %}<script src="/static/login.js"></script>{% endblock %}
